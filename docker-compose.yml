# Postgres for local development and tests, for contributors without a local install:
#   docker compose up -d
# The default test database is postgres://localhost/strand_test; with this container use
#   DATABASE_URL=postgres://strand:strand@localhost:5432/strand_test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strand
      POSTGRES_PASSWORD: strand
      POSTGRES_DB: strand_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strand"]
      interval: 5s
      timeout: 3s
      retries: 10
